upstream botsbshnik_upstream { server 127.0.0.1:5000; keepalive 32; }
upstream reqcore_upstream    { server 127.0.0.1:3000; keepalive 32; }

# ── Rate limiting zones ────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
limit_req_status 429;
limit_conn_status 429;

# ── Бот СБшник на :80 (default — для IP-доступа) ──────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 25M;
    access_log /var/log/nginx/bot.access.log;
    error_log  /var/log/nginx/bot.error.log;

    location / {
        proxy_pass http://botsbshnik_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── HTTP huntfork.ru → редирект на HTTPS (кроме ACME) ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name huntfork.ru www.huntfork.ru;

    # ACME challenge для авто-обновления Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS huntfork.ru (Huntfork app) ──────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name huntfork.ru www.huntfork.ru;
    client_max_body_size 25M;
    access_log /var/log/nginx/huntfork.access.log;
    error_log  /var/log/nginx/huntfork.error.log;

    # Let's Encrypt cert
    ssl_certificate     /etc/letsencrypt/live/huntfork.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huntfork.ru/privkey.pem;

    # Modern TLS — отключаем устаревшие протоколы
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Connection limit per IP
    limit_conn conn_zone 50;

    # ── Жёсткий лимит на /api/auth/* ──
    location ^~ /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://reqcore_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Умеренный лимит на остальной API ──
    location ^~ /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        proxy_pass http://reqcore_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://reqcore_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── Старый :8080 (HTTP по IP — оставляем как backup) ──────────────
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    client_max_body_size 25M;
    access_log /var/log/nginx/reqcore.access.log;
    error_log  /var/log/nginx/reqcore.error.log;

    limit_conn conn_zone 50;

    location ^~ /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://reqcore_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location ^~ /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        proxy_pass http://reqcore_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://reqcore_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
